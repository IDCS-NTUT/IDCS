# Image-plane aiming and the legacy control section: camera geometry for
# aiming, laser-point aim mode, deadband, swarm timing inputs. The live
# controller's own settings are in controller.yaml.

control:
  aim_mode: "laser_point"   # "laser_point" (default) or "camera_center"
  fov_deg: { h: 135.0, v: 73.0 }  # if intrinsics unknown
  fx_fy_from_fov: true     # compute fx,fy from FOV
  laser:
    tolerance_px: 20.0         # acceptable pixel delta between laser dot and target
    use_range: "known_size"   # known_size | ground_plane | auto | infinite
    default_distance_m: 10.0  # explicit infinite policy only; unavailable known-size range disables parallax
  sign_convention:
    yaw_positive: "right"    # "left"=u>cx is -yaw; use when yaw direction is inverted
    pitch_positive: "up"     # v>cy decreases pitch; flip if needed
