# Standalone passive DeepStream runtime profile: no controller, gimbal, or ControlCmd socket.
deepstream:
  input_mode: rtp
  nvinfer_config: configs/deepstream/nvinfer_yolo26s_736_drone_person_smoke.txt
  target_selection: true
  # For a Jetson-local camera use input_mode: argus. Its V2 snapshots carry
  # local source timing and intentionally have no PC header correlation.
  argus_sensor_id: 0
  argus_sensor_mode: 4
  argus_width: 1280
  argus_height: 720
  argus_fps: 60
  # Camera mounting correction applied before inference: 0 none, 2 rotate
  # 180 (upside down), 4 horizontal, 6 vertical flip.
  argus_flip_method: 0
  # White balance (nvarguscamerasrc wbmode): 1 auto, 3 fluorescent, 5 daylight,
  # 6 cloudy daylight. Auto balance is unreliable on this IMX219 (magenta
  # under the lab's fluorescent light, 2026-09-29): prefer a fixed preset.
  argus_wb_mode: 1
  # nvsort (motion only) | nvdcf (visual correlation filter; keeps tracking when
  # YOLO misses). nvdcf is under evaluation against simulator ground truth.
  tracker: nvdcf
  # Publish NvDCF's own estimates for targets it holds back (shadow tracking)
  # when YOLO misses, gated here rather than by the closed tracker library.
  shadow_tracks:
    enabled: true
    # Gate for every coasting box: shadow estimates and NvDCF's own
    # tracker-only objects (which were published at confidence 0 and never
    # gated, so the 2026-09-28 fast-target gate sweep could not remove them).
    # Swarm recording (2026-09-28): coasting boxes with tracker confidence
    # < 0.2 were on a drone 1-7% of the time, >= 0.3 87-100%; ungated they
    # were 52-57% of all selected targets.
    min_confidence: 0.3
    max_age_frames: 30       # 0.5 s at 60 fps
  # One track id per drone across NvDCF re-identification (it gave a swarm
  # drone 2.7 ids on average when detections dropped out, 2026-09-28): a new
  # tracker id continues a track lost within max_gap_frames near its
  # predicted position; overlapping tracks on one drone are published once.
  id_stitching:
    enabled: true
    max_gap_frames: 45       # 0.75 s at 60 fps
  # Frame id and source time travel inside the RTP stream (the PC streamer
  # runs with --verified-rtp-headers), so a controller consuming these
  # snapshots gets verified frame identity instead of order-based matching.
  verified_rtp_headers: true
