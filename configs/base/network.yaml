source: "webcam"
#source: "rpi"
#source: "file:assets/videos/one.mp4"

video:
  active_profile: "1080p"
  active_return_profile: "720p30"
  return_jitter_ms: 20
  return_queue_buffers: 1
  profiles:
    "720p":
      width: 1280
      height: 720
      fps: 60
      bitrate_kbps: 7000
    "720p30":             # the return video (Jetson -> PC operator UI)
      width: 1280
      height: 720
      fps: 30
      # 7 Mbps with an intra frame every frame left the return 3x grainier than
      # the camera; with keyframes every 30 frames at 20 Mbps the median grain
      # matches the camera (2026-09-29). ~2% of the gigabit link.
      bitrate_kbps: 20000
    "1080p":
      width: 1920
      height: 1080
      fps: 60
      bitrate_kbps: 9000

net:
  jetson_ip: 192.168.0.5
  rtp_port: 5000
  zmq_perception_v2: "tcp://192.168.0.5:5564"  # Jetson PUB → V2 controller/trace consumers
  header_push: "tcp://192.168.0.5:5555"    # PC PUSH → Jetson PULL
  zmq_control: "tcp://192.168.0.5:5557"    # Jetson PUB → PC SUB (control cmds)
  zmq_control_diagnostics: "tcp://192.168.0.5:5565"  # Jetson PUB → PC UI (read-only controller diagnostics)
  zmq_gimbal_state: "tcp://192.168.0.5:5558"  # Jetson PUB → SUB for physical CamState
  zmq_manual_state: "tcp://192.168.0.5:5559"  # RPi PUSH → Jetson PULL (manual switch/joystick state)
  zmq_operator_command: "tcp://192.168.0.5:5590"  # RPi panel display REQ → Jetson operator agent REP
  zmq_operator_selection: "tcp://127.0.0.1:5591"  # Jetson operator agent PUB → DeepStream (lock, target classes)
  pc_bind_ip: 192.168.0.1                  # optional local bind IP for PC RTP sockets
  zmq_source_clock_sync: "tcp://192.168.0.1:5575"  # PC monotonic-clock responder for Jetson frame-time mapping
  return_ip: 192.168.0.1                   # Jetson return-video destination; set explicitly per deployment
  return_mirror_ips: [192.168.0.3]          # same return stream to the Pi panel display (rpi.operator_display)
  rtp_return_port: 5002                     # Jetson → PC video (RTP)
