# Operator commands from the panel screen (rpi.operator_display), served on
# the Jetson by jetson.operator_agent: target lock, target classes, mode
# switching and recording. See docs/operator_display.md.

operator:
  hud:
    push_endpoint: "tcp://192.168.0.3:5594"     # outbound from PC; PC identity may change
    pose_sub: "tcp://127.0.0.1:5572"
    perception_sub: "tcp://127.0.0.1:5574"
    diagnostics_sub: "tcp://127.0.0.1:15565"
  sim_selection_bind: "tcp://127.0.0.1:5579"  # PC agent -> local sim target policy, never motor authority
  sim_activity_sub: "tcp://127.0.0.1:5572"  # PC mode agent reads the simulator's actual intent-consumer status
  # Ordered transition: stop PC source/UI, stop Jetson source, start Jetson
  # source, start PC source/UI, verify units + fresh source/return frames.
  # HIL is deliberately absent: it energizes the motors and starts at the
  # bench after homing (docs/launch_procedure.md).
  modes:
    camera:                                   # DeepStream on the Jetson's IMX219
      label: "Camera"
      start: [idcs-camera.target]
      stop: [idcs-deepstream-video.service, idcs-camera.target,
             idcs-deepstream-camera.service, idcs-controller-camera.service,
             idcs-visual-lock-camera.service, idcs-visual-lock-sim.service]
      pc_stop: [idcs-sim.target, idcs-sim-swarm.target, idcs-sim-visual-lock.target, idcs-sim-session.target]
      pc_start: [idcs-camera-ui.service]
      ready_units: [idcs-camera.target, idcs-deepstream-camera.service, idcs-controller-camera.service]
      pc_ready_units: [idcs-camera-ui.service]
      source_clock: jetson_monotonic
    sim:                                      # software-only simulated mount; never HIL
      label: "Simulator"
      start: [idcs-deepstream-video.service]
      stop: [idcs-camera.target, idcs-deepstream-camera.service, idcs-controller-camera.service,
             idcs-deepstream-video.service, idcs-visual-lock-camera.service, idcs-visual-lock-sim.service]
      pc_stop: [idcs-sim.target, idcs-sim-swarm.target, idcs-sim-visual-lock.target, idcs-sim-session.target, idcs-camera-ui.service]
      pc_start: [idcs-sim.target]
      ready_units: [idcs-deepstream-video.service]
      pc_ready_units: [idcs-sim.target, idcs-sim-session.target, idcs-sim-streamer.service, idcs-sim-panel.service,
                       idcs-sim-controller.service, idcs-sim-ui.service]
      source_clock: pc_monotonic
    sim_swarm:                                # internal variant, nested under Simulator in the menu
      label: "Simulator / Swarm"
      start: [idcs-deepstream-video.service]
      stop: [idcs-camera.target, idcs-deepstream-camera.service, idcs-controller-camera.service,
             idcs-deepstream-video.service, idcs-visual-lock-camera.service, idcs-visual-lock-sim.service]
      pc_stop: [idcs-sim.target, idcs-sim-swarm.target, idcs-sim-visual-lock.target, idcs-sim-session.target, idcs-camera-ui.service]
      pc_start: [idcs-sim-swarm.target]
      ready_units: [idcs-deepstream-video.service]
      pc_ready_units: [idcs-sim-swarm.target, idcs-sim-session.target, idcs-sim-swarm-streamer.service,
                       idcs-sim-panel.service, idcs-sim-swarm-controller.service, idcs-sim-ui.service]
      source_clock: pc_monotonic
    camera_visual_lock:
      label: "Camera / Visual lock"
      start: [idcs-visual-lock-camera.service, idcs-controller-camera.service]
      stop: [idcs-camera.target, idcs-deepstream-camera.service, idcs-controller-camera.service,
             idcs-deepstream-video.service, idcs-visual-lock-camera.service, idcs-visual-lock-sim.service]
      pc_stop: [idcs-sim.target, idcs-sim-swarm.target, idcs-sim-visual-lock.target, idcs-sim-session.target, idcs-camera-ui.service]
      pc_start: [idcs-camera-ui.service]
      ready_units: [idcs-visual-lock-camera.service, idcs-controller-camera.service]
      pc_ready_units: [idcs-camera-ui.service]
      source_clock: jetson_monotonic
      health_file: /run/idcs/visual-lock-camera-health.json
    sim_visual_lock:
      label: "Simulator / Visual lock"
      start: [idcs-visual-lock-sim.service]
      stop: [idcs-camera.target, idcs-deepstream-camera.service, idcs-controller-camera.service,
             idcs-deepstream-video.service, idcs-visual-lock-camera.service, idcs-visual-lock-sim.service]
      pc_stop: [idcs-sim.target, idcs-sim-swarm.target, idcs-sim-visual-lock.target, idcs-sim-session.target, idcs-camera-ui.service]
      pc_start: [idcs-sim-visual-lock.target]   # one slow drone; controller fed by the Jetson lock
      ready_units: [idcs-visual-lock-sim.service]
      pc_ready_units: [idcs-sim-visual-lock.target, idcs-sim-session.target, idcs-sim-visual-lock-streamer.service,
                       idcs-sim-panel.service, idcs-sim-visual-lock-controller.service, idcs-sim-ui.service]
      source_clock: pc_monotonic
      health_file: /run/idcs/visual-lock-sim-health.json
    standby:                                  # no perception running
      label: "Standby"
      start: []
      stop: [idcs-camera.target, idcs-deepstream-camera.service, idcs-controller-camera.service,
             idcs-deepstream-video.service, idcs-visual-lock-camera.service, idcs-visual-lock-sim.service]
      pc_stop: [idcs-sim.target, idcs-sim-swarm.target, idcs-sim-visual-lock.target, idcs-sim-session.target, idcs-camera-ui.service]
  # While any of these is active the motors may be live: no mode switching.
  motor_units: [idcs-hil.target, idcs-bridge.service, idcs-serial.service, idcs-controller.service]
  readiness_timeout_s: 30
  health_file: /run/idcs/deepstream-video-health.json
  recorder_unit: idcs-recorder.service
  # Clear a missing lock after this long, but remain in Operator selection.
  lock_lost_s: 1.0
  state_file: "~/.local/state/idcs/operator_agent.json"
