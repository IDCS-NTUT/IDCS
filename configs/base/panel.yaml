# Raspberry Pi panel: GPIO map, input pulls/levels, switch lights and
# return-video display (rpi.runtime_control, rpi.operator_display).

rpi:
  operator_display:                             # rpi.operator_display: return video + menu on the panel screen
    sink: "waylandsink fullscreen=true sync=false"  # show each frame on arrival; sync=true dropped half as late
    session_env:                                # the Pi desktop's (labwc) Wayland socket
      WAYLAND_DISPLAY: "wayland-0"
      XDG_RUNTIME_DIR: "/run/user/1000"
    panel_state_endpoint: "tcp://127.0.0.1:5578"  # rpi.runtime_control PUB -> display (joystick, input roles)
    roi_lamp_endpoint: "tcp://127.0.0.1:5581"  # opt-in display PUB -> runtime lamp, joystick capture and auto block
    roi_control_endpoint: "tcp://192.168.0.3:5582"  # opt-in display PUB -> PC SIM-only gate (disabled in display-only ROI)
    hud_sim_bind: "tcp://0.0.0.0:5594"           # display-only PC-initiated PUSH, never command authority
  runtime_control:
    invert_yaw: false
    invert_pitch: true
    sim_panel_pub_endpoint: "tcp://192.168.0.3:5580"  # sampled Pi GPIO/joystick state to PC SIM only
    indicators:
      fire_control_off_delay_s: 1.0
      safety_off_delay_s: 1.0
      perception_stale_s: 0.5
      hardware_stale_s: 0.5
      control_stale_s: 0.5
  gpio:
    # The deployed control panel (Pi 192.168.0.3), as proven on its
    # codex/controller-improvements checkout: E-stop is active-high, the
    # GPIO12 enables automatic tracking only; GPIO16 enables the fire button.
    # ONLY these two contacts share lamp power. Lamp-off means unreadable,
    # not physical switch-off. Power follows perception, never the input.
    # Unreadable contacts grant no permission; reacquisition rereads them.
    shared_lamp_inputs:
      fire_control: fire_control_lamp
      safety: safety_lamp
    input_pull: up
    input_pulls:
      control_switch: down
      fire_control: down
      safety: down
    input_active_levels:
      emergency: high
    input_modes:
      control_switch: latch
    output_active_level: low
    inputs:
      fire: 13
      fire_control: 12
      safety: 16
      emergency: 6
      control_switch: 5
    outputs:
      fire_control_lamp: 22
      safety_lamp: 25
      green_light: 18
      yellow_light: 23
      red_light: 24
