# Simulator-only camera/control contract.
#
# This file is intentionally separate from configs/control.yaml.  It defines a
# conservative integration-test controller and must never be used to infer or
# tune real gimbal gains.

control:
  # Drive the target to the configured projected parallax point. The target
  # therefore settles away from optical centre while aligning with the aim cue.
  aim_mode: "laser_point"
  deadband_px: 2
  lost_target_timeout_ms: 100

sim:
  # Stable-substitute motion must not inherit the identified hardware plant.
  # The fitted model includes real-mount disturbance bias, so a zero command
  # is not an idle equilibrium and can make a control-free simulated camera
  # drift. Hardware-in-loop profiles opt into the fitted plant separately.
  plant_model:
    mode: "ideal"

  evaluation_contract:
    motion_model_role: "stable_substitute"
    detection_fidelity_goal: "real_camera_equivalent"
    hardware_controller_simulation_role: "interface_observation_only"
    hardware_tuning_from_sim_allowed: false

  camera:
    # The CPU and OpenGL renderers use this same vertical projection FOV.
    # The controller derives horizontal FOV and fx/fy from it and frame aspect.
    fov_y_deg: 60.0

  baseline_controller:
    type: "bounded_p"
    loop_hz: 50.0
    valid_for_ms: 50.0
    kp: {yaw: 3.0, pitch: 3.0}
    rate_limits_rad_s: {yaw: 0.30, pitch: 0.20}
    accel_limits_rad_s2: {yaw: 1.0, pitch: 0.8}

    # When selection is lost, return the simulated camera to its neutral pose
    # so a moving target can cross the field of view and be acquired again.
    # This behavior is simulator-only and is not a real-gimbal search policy.
    target_loss_recovery:
      enabled: true
      delay_s: 0.25
      home_rad: {yaw: 0.0, pitch: 0.0}
      kp: {yaw: 1.5, pitch: 1.5}
      rate_limits_rad_s: {yaw: 0.20, pitch: 0.15}
      accel_limits_rad_s2: {yaw: 0.8, pitch: 0.6}
      tolerance_rad: 0.005

    # End-to-end integration gates for the moving-person scenario.  These
    # assess target retention and centering, not real-hardware tuning quality.
    acceptance:
      min_duration_s: 20.0
      warmup_s: 5.0
      max_acquisition_time_s: 5.0
      acquisition_error_px: 22.0
      acquisition_hold_s: 1.0
      min_tracking_fraction: 0.98
      max_rms_error_px: 14.0
      max_p95_error_px: 22.0
      max_rate_limited_fraction: 0.05
      max_command_drops: 0
      min_yaw_pose_span_rad: 0.05
