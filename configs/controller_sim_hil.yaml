# Overlay for the controller service against the PC simulator (hardware-in-loop).
# Detections are the streamer's ground-truth PerceptionSnapshots, published
# --sim-total-latency-ms after capture. Camera intrinsics and aim come from the
# shared config (135x73 deg, laser point), matching the V2 simulator scene.
controller:
  mode: "live"
  # The V2 scene target is ~0.33 rad yaw / 0.26 rad pitch from home; stay
  # inside the bridge bench envelope (+/-0.5 rad yaw around rest).
  max_travel_rad: 0.45
  endpoints:
    snapshot_sub: "tcp://192.168.0.1:5574"
