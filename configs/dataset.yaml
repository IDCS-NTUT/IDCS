# Dataset builder configuration for threat evaluation model

# Window parameters for creating training samples
window:
  size: 16  # number of frames per sample
  stride: 4  # overlap between windows (smaller = more samples)
  min_track_length: 16  # minimum track length required
  
# Data filtering
filtering:
  min_confidence: 0.3  # exclude detections below this confidence
  max_missing_frames: 3  # skip windows with >N consecutive missing frames
  
# Dataset split ratios
split:
  train: 0.70
  val: 0.15
  test: 0.15
  heldout: 0.10  # fraction of scenarios reserved for true held-out evaluation
  group_by_scenario: true
  seed: 42

# Leakage audit checks for label leakage from overly deterministic features
leakage:
  enabled: true
  bins: 32
  suspect_accuracy_threshold: 0.98
  enforce_no_suspect_features: false
  
# Feature normalization bounds
normalization:
  image_width: 1920
  image_height: 1080
  max_distance_m: 30.0
  max_velocity_m_s: 5.0
  max_time_in_zone_s: 60.0
  
# Output paths
output:
  directory: artifacts/threat/datasets/default/
  format: npz  # numpy compressed format
  include_metadata: true
  metadata_file: artifacts/threat/datasets/default/metadata.csv
  
# Logging
logging:
  verbose: true
  save_statistics: true  # per-class distribution, confidence stats
  statistics_file: artifacts/threat/datasets/default/statistics.json
