# Harder dataset builder configuration for threat evaluation model
#
# Goals:
# - admit noisier / lower-confidence windows
# - allow more interrupted detections
# - shorten the temporal window so the classifier has less context
# - reduce train split and enlarge val/test so evaluation is more meaningful

window:
  size: 12  # less temporal context than the default 16-frame window
  stride: 3
  min_track_length: 12

filtering:
  min_confidence: 0.2  # include weaker detections instead of filtering them out
  max_missing_frames: 5  # retain noisier windows with longer detection gaps

split:
  train: 0.60
  val: 0.20
  test: 0.20
  heldout: 0.10
  group_by_scenario: true
  seed: 42

leakage:
  enabled: true
  bins: 32
  suspect_accuracy_threshold: 0.98
  enforce_no_suspect_features: false

normalization:
  image_width: 1920
  image_height: 1080
  max_distance_m: 30.0
  max_velocity_m_s: 6.0
  max_time_in_zone_s: 60.0

output:
  directory: artifacts/threat/datasets/hard/
  format: npz
  include_metadata: true
  metadata_file: artifacts/threat/datasets/hard/metadata.csv

logging:
  verbose: true
  save_statistics: true
  statistics_file: artifacts/threat/datasets/hard/statistics.json
