# IDCS NvDCF tracker profile: NVIDIA's config_tracker_NvDCF_perf.yml
# (DeepStream samples) as the starting point; IDCS changes are marked
# "IDCS:" inline. NvDCF keeps a per-target visual correlation filter (ColorNames
# features, VPI backend) and reports targets it carries without a detector
# match with detector confidence -0.1; the pipeline draws those amber and the
# snapshot counts them in PerceptionTrackV2.missed_frames.
# Settings that decide behaviour when YOLO misses the target:
#   minTrackerConfidence  below this the target drops to shadow mode (not reported)
#   maxShadowTrackingAge  frames a target may stay in shadow before termination
#                         (51 frames = 0.85 s at 60 fps)
#   probationAge / earlyTerminationAge  how quickly new targets are confirmed/dropped
# Tune only against simulator ground truth (induced YOLO misses).
