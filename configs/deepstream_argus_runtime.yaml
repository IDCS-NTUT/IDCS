# Jetson-local IMX219/Argus DeepStream profile. DetectionMsg timing is local
# to the Jetson; no PC frame header is expected or fabricated.
deepstream:
  input_mode: argus
  nvinfer_config: configs/deepstream/nvinfer_yolo26s_736_drone_person_smoke.txt
  target_selection: true
  argus_sensor_id: 0
  argus_sensor_mode: 4
  argus_width: 1280
  argus_height: 720
  argus_fps: 60
