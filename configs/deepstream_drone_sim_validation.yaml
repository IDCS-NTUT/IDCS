# Simulation-only drone selection exercise. Never use for real targeting.
# Load after deepstream_person_sim_validation.yaml while the host is explicitly
# in stable-substitute mode. The Jetson remains control-free; any downstream
# controller used with this profile must publish only to the loopback simulator.

# The OpenGL simulator renders 1280x720 with a 60 degree vertical FOV. Match
# those intrinsics here so known-size ranging is not contaminated by the real
# camera's much wider 135 degree horizontal FOV.
camera:
  intrinsics:
    source: "fov"
    fov_deg: { h: 91.49284451967722, v: 60.0 }

swarm_eval:
  enabled: true
  hostile_levels: ["suspicious", "threatening"]
  max_engage_distance_m: 25.0
  exact_search_limit: 6
  beam_width: 8
  switch_absolute_damage_gain: 0.25
  switch_relative_improvement: 0.10
  default_damage_weight: 1.0
  excluded_target_classes: ["person"]
  damage_by_class:
    drone: 1.0
    person: 0.0
  learned_model:
    enabled: true
    backend: torch
    model_path: assets/models/swarm/swarm_policy.pt
    fallback_to_planner: true
    async_worker: true
    max_update_rate_hz: 10.0
    max_result_age_ms: 150.0
    max_targets_tensor: 8
    normalization:
      max_distance_m: 80.0
      max_closing_speed_m_s: 12.0
      max_breakthrough_time_s: 40.0
      max_time_to_engage_s: 8.0
      max_damage_weight: 10.0
      max_angle_rad: 0.8
      max_track_observations: 10
      max_track_age_s: 5.0
