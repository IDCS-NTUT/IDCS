# Controlled native-mesh drone target for the V2 OpenGL integration pipeline.
# Load after deepstream_pc_moving_tracking_opengl.yaml.  It replaces only the
# scene target list and retains the stable-substitute, loopback-only camera.
source: "sim"

sim:
  use_jetson_cam_state: false
  scene:
    targets:
      - sprite: "drone"
        # Drone meshes and known-size ranging both use width as their semantic
        # axis. Keep this equal to camera.known_size_ranging.class_sizes_m.drone
        # so the rendered geometry and the predetermined depth estimate agree.
        width: 0.35
        height: 0.4
        color: [55, 65, 75]
        orientation: [90.0, 0.0, 0.0]
        movement:
          type: "path"
          speed_m_s: 0.25
          # Keep the physically sized 0.35 m mesh close enough to provide a
          # stable detector footprint; distance still varies for ranging and
          # parallax validation without changing target scale.
          points:
            - [0.5, 1.4, -2.5]
            - [1.0, 1.4, -2.5]
            - [1.0, 1.4, -2.9]
            - [0.5, 1.4, -2.9]
          dynamics:
            enabled: true
            max_accel_m_s2: 0.5
            max_decel_m_s2: 0.7
            arrival_radius_m: 0.05
