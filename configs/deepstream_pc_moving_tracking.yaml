# Controlled moving-target profile for the passive V2/NvSORT video pipeline.
# This profile never subscribes to a control endpoint and cannot command hardware.
source: "sim"

video:
  active_profile: "720p"
  profiles:
    "720p":
      width: 1280
      height: 720
      fps: 60
      bitrate_kbps: 8000

sim:
  # Use the camera-facing sprite renderer qualified with small_736. The OpenGL
  # person mesh remains visual-only because it did not register reliably.
  renderer: "cpu"
  freeze_frame: false
  render_fps: 120
  # Advance camera pose through the independently validated hardware fit.
  # With no --sim-control-sub this remains passive; controller experiments
  # must use an explicitly non-production ControlCmd endpoint.
  plant_model:
    mode: "qualified_gray_box"
    fit_report: "artifacts/gimbal_fit/controller_sysid_pid_range_wire_20260914/fit_report.json"
    validation_report: "artifacts/gimbal_fit/controller_sysid_pid_range_wire_20260914/independent_validation_report.json"
  renderer_opts:
    draw_ground_grid: false
  scene:
    mode: "static_targets"
    targets:
      - sprite: "person"
        height: 1.7
        # Keep motion near the previously qualified person view at [2, -6].
        # Path points are billboard centres: [world_x, height/2, world_z].
        movement:
          type: "path"
          speed_m_s: 0.25
          points:
            - [1.6, 0.85, -5.8]
            - [2.4, 0.85, -5.8]
            - [2.4, 0.85, -6.2]
            - [1.6, 0.85, -6.2]
          dynamics:
            enabled: true
            max_accel_m_s2: 0.5
            max_decel_m_s2: 0.7
            arrival_radius_m: 0.05
    buildings:
      - base_centre: [-5.0, -9.0]
        footprint: [4.0, 3.0]
        height: 6.0
        color: [150, 170, 180]
    cubes: []
  use_jetson_cam_state: false
