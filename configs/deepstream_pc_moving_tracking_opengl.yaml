# Final override for GPU-rendered V2 moving-target integration tests.
#
# Load this after deepstream_pc_moving_tracking.yaml and control_sim.yaml.
# The explicit CamState setting is a safety boundary: this profile must use
# only the simulated plant and must never follow or command the real mount.
source: "sim"

sim:
  renderer: "opengl"
  freeze_frame: false
  render_fps: 120
  use_jetson_cam_state: false
  renderer_opts:
    # Exercise the native OpenGL object path: person and drone aliases resolve
    # to assets/meshes/person.obj and assets/meshes/drone.stl respectively.
    target_render_mode: "mesh"
    # The repository-wide HDR defaults are intentionally cinematic and very
    # dark.  This controlled pipeline profile uses a daylight procedural sky
    # so the dark person sprite retains the contrast seen in the qualified CPU
    # scenario; detector thresholds remain unchanged.
    sky:
      type: "procedural"
      intensity: 1.0
      procedural:
        horizon_color: [0.75, 0.80, 0.85]
        zenith_color: [0.45, 0.65, 0.90]
        sun_color: [1.0, 0.98, 0.90]
        sun_elevation: 60.0
        sun_azimuth: 180.0
        turbidity: 2.0
    ibl:
      enabled: false
      intensity: 0.25
    ground:
      color: [155, 175, 160]
      albedo_map: ""
      normal_map: ""
    building:
      albedo_map: ""
      normal_map: ""
  scene:
    # Native 3D person mesh, deliberately sized above DeepStream's 16 px
    # minimum object width throughout the controlled moving-target path.
    targets:
      - sprite: "person"
        height: 3.2
        color: [55, 65, 75]
        movement:
          type: "path"
          speed_m_s: 0.25
          points:
            - [0.8, 1.6, -4.0]
            - [1.6, 1.6, -4.0]
            - [1.6, 1.6, -4.4]
            - [0.8, 1.6, -4.4]
          dynamics:
            enabled: true
            max_accel_m_s2: 0.5
            max_decel_m_s2: 0.7
            arrival_radius_m: 0.05
