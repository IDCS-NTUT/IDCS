# Explicit PC-originated DeepStream shadow-validation override.
# Use as the final --config-extra layer for pc.streamer and pc.ui.
# This does not enable controller feedback or alter production network ports.
source: "sim"

video:
  active_profile: "720p"
  profiles:
    "720p":
      width: 1280
      height: 720
      fps: 60
      bitrate_kbps: 8000

sim:
  # The trained model's deterministic canary is qualified against this sprite
  # renderer. OpenGL remains available in system.yaml for visual-only runs.
  renderer: "cpu"
  # Repeat one qualified synthetic scene frame. Frame headers and DeepStream
  # processing remain live at 60 Hz while target appearance is held constant,
  # isolating pipeline behavior from renderer cost and animation variance.
  freeze_frame: true
  # Retained for renderer-capacity experiments; frozen canary pacing is set by
  # video.profiles.720p.fps.
  render_fps: 120
  renderer_opts:
    # Decorative only; removing it leaves trained-model targets intact and
    # keeps the CPU-only PC smoke source within the 60-FPS budget.
    draw_ground_grid: false
  use_jetson_cam_state: false
  # Commands remain disabled unless an explicit non-production endpoint is
  # supplied with pc.streamer --sim-control-sub.
