# Standalone passive DeepStream runtime profile: no controller, gimbal, or ControlCmd socket.
deepstream:
  input_mode: rtp
  nvinfer_config: configs/deepstream/nvinfer_yolo26s_736_drone_person_smoke.txt
  target_selection: true
  # For a Jetson-local camera use input_mode: argus. Its V2 snapshots carry
  # local source timing and intentionally have no PC header correlation.
  argus_sensor_id: 0
  argus_sensor_mode: 4
  argus_width: 1280
  argus_height: 720
  argus_fps: 60
  # nvsort (motion only) | nvdcf (visual correlation filter; keeps tracking when
  # YOLO misses). nvdcf is under evaluation against simulator ground truth.
  tracker: nvdcf
  # Publish NvDCF's own estimates for targets it holds back (shadow tracking)
  # when YOLO misses, gated here rather than by the closed tracker library.
  shadow_tracks:
    enabled: true
    min_confidence: 0.0      # measurement setting: tune against simulator truth
    max_age_frames: 30       # 0.5 s at 60 fps
  # Frame id and source time travel inside the RTP stream (the PC streamer
  # runs with --verified-rtp-headers), so a controller consuming these
  # snapshots gets verified frame identity instead of order-based matching.
  verified_rtp_headers: true
