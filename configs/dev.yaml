uplink:               # PC -> Jetson (encoder on PC, decoder on Jetson)
  width: 3200
  height: 1920
  fps: 30
  bitrate_kbps: 20000     # tune; see notes
  vbv_scale: 2            # multiplier for (bitrate/fps) when computing vbv-size

return:               # Jetson -> PC (encoder on Jetson, decoder on PC)
  width: 1280
  height: 720
  fps: 30
  bitrate_kbps: 6000
  vbv_scale: 2

net:
  jetson_ip: 192.168.0.2
  rtp_port: 5000
  zmq_results: "tcp://192.168.0.2:5556"
  header_push: "tcp://192.168.0.2:5555"    # PC PUSH → Jetson PULL
  pc_ip: 192.168.0.1                       # PC’s IP for return video
  rtp_return_port: 5002                     # Jetson → PC video (RTP)

yolo:
  engine_path: "/home/idcs/Desktop/project/repo/IDCS/assets/best.engine"  # TensorRT engine (fixed 640x640)
  conf_thres: 0.25
  iou_thres: 0.45
  preprocess_mode: bilinear   # or "nearest"
  input_size: 640

perf:
  max_queue: 2
  drop_policy: oldest
source: "sim"
sim:
  renderer: cpu            # Renderer backend for the synthetic camera ("cpu" or "gl")
  # renderer_opts:
  #   samples: 4            # Extra options forwarded to the renderer (e.g. MSAA for "gl")
