video:
  active_profile: "720p"
  profiles:
    "720p":
      width: 1280
      height: 960
      fps: 30
      bitrate_kbps: 7000
    "1080p":
      width: 1920
      height: 1440
      fps: 20
      bitrate_kbps: 9000

camera:
  intrinsics:
    source: "fov"
    fov_deg: { h: 84.0, v: 53.0 }
  known_size_ranging:
    enabled: true
    dimension: "height"
    class_sizes_m:
      drone: 0.35
      person: 1.70
    class_aspect_ratio_limits:
      drone: { min: 0.6, max: 1.6 }
      person: { min: 1.2, max: 4.5 }
    min_pixels: 40.0
    ema_alpha: 0.9
net:
  jetson_ip: 192.168.0.2
  rtp_port: 5000
  zmq_results: "tcp://192.168.0.2:5556"
  header_push: "tcp://192.168.0.2:5555"    # PC PUSH → Jetson PULL
  zmq_control: "tcp://192.168.0.2:5557"    # Jetson PUB → PC SUB (control cmds)
  zmq_gimbal_state: "tcp://192.168.0.2:5558"  # Jetson PUB → SUB for physical CamState
  config_sync: "tcp://192.168.0.2:5560"    # Jetson binds REP; PC connects REQ for config handshake
  pc_ip: 192.168.0.1                       # PC’s IP for return video
  rtp_return_port: 5002                     # Jetson → PC video (RTP)

yolo:
  engine_size: "nano"  # Selects assets/nano_*.engine
  conf_thres: 0.25
  iou_thres: 0.45
  preprocess_mode: bilinear   # or "nearest"
  input_size: 1280
  class_labels:
    "0": drone
    "1": person

logging:
  cli_json: false            # pretty CLI logs by default; set true to emit JSON

perf:
  max_queue: 2
  drop_policy: oldest
source: "sim"
#source: "file:assets/one.mp4"

sim:
  renderer: cpu
  debug: false  # Enable orbiting camera + cube when true

control:
  mode: "rate"             # "rate" or "position"
  controller: "mpc"         # set "mpc" to enable predictive controller, "pid" for legacy loop
  aim_mode: "laser_point"   # "laser_point" (default) or "camera_center"
  loop_hz: 60              # control tick; if null, run at detection rate
  fov_deg: { h: 84.0, v: 53.0 }  # if intrinsics unknown
  fx_fy_from_fov: true     # compute fx,fy from FOV
  kp: { yaw: 5.0, pitch: 5.0 }    # rad/s per rad error
  kd: { yaw: 0.5, pitch: 0.5 }    # derivative gain
  ki: { yaw: 0.5, pitch: 0.5 }    # start at 0 to avoid windup
  rate_limits: { yaw: 10.0, pitch: 10.0 }  # rad/s caps
  accel_limits: { yaw: 40.0, pitch: 40.0 } # rad/s^2 slew
  deadband_px: 3            # ignore tiny errors
  smooth_px_alpha: 0.2      # EMA on centroid to reduce jitter
  lost_target_timeout_ms: 200
  reinit_on_lost: true
  target_selector: "max_conf"   # or "largest_area", "class:person"
  laser:
    tolerance_px: 4.0         # acceptable pixel delta between laser dot and target
    use_range: "known_size"   # known_size | ground_plane | auto | infinite
    default_distance_m: 25.0  # fallback distance when range unavailable
  sign_convention:
    yaw_positive: "right"    # "right"=u>cx is +yaw; flip if your axes differ
    pitch_positive: "up"     # v>cy decreases pitch; flip if needed
  debug_overlay:
    enabled: true            # true → draw MPC term bars on return feed; false → hide overlay entirely
    history_window_s: 1.0     # higher → show longer history (more smoothing); lower → only recent frames
    opacity: 0.85             # higher → more opaque overlay; lower → less distracting translucent panel
    bar_height_px: 48         # higher → taller stacked bars; lower → conserve screen real-estate
    show_terms:               # order controls legend stacking; remove entries to hide those terms
      - theta                 # positional tracking penalty (higher weight → bigger bar when active)
      - theta_linear          # signed positional bias (direction follows sign of error)
      - omega                 # rate tracking penalty
      - dtheta                # error-change penalty capturing how error evolves over the horizon
      - dtheta_linear         # signed error-change bias (direction follows sign of delta error)
      - effort                # absolute control effort term (R)
      - slew                  # input rate-change term (S)
      - slew_linear           # signed slew bias (direction follows sign of commanded change)
      - slack                 # constraint slack penalty if soft bounds activate
  mpc:
    # MPC settings are ignored unless controller == "mpc". Values below are
    # representative defaults and should be tuned per rig.
    horizons:
      prediction: 30         # higher → more foresight but heavier QP; lower → faster but shortsighted
      control: 15             # higher → more free moves; lower → forces earlier hold/blocked inputs
      sample_time_s: 0.04    # higher → slower loop, more lag; lower → faster updates, more noise sensitivity
      gamma: 0.7            # higher → value distant future errors more; lower → prioritize near-term tracking
      move_blocking: false   # true → reduces chatter by tying tail moves; false → allows independent steps
    plant:
      a_u: 15.0              # higher → assumes stronger actuation, leading to smaller commands; lower → opposite
      a_f: 1.0               # higher → models more damping so MPC pushes harder; lower → assumes freer motion
    estimator:
      q_theta: 0.1          # higher → trust model less for angle, faster adaptation; lower → smoother but slower
      q_omega: 0.05          # higher → allows quicker rate estimate changes; lower → steadier but laggier
      q_d: 0.1              # higher → lets disturbance term wander; lower → keeps bias nearly constant
      r_theta: 1e-2          # higher → treat measurements as noisy (smoother estimates); lower → follow sensors tightly
    costs:
      # Quadratic and linear tracking weights (shared across yaw/pitch)
      q_theta: 5.0         # symmetric angular tracking penalty; higher → punish large angle error more
      l_theta: 10.0          # signed bias on angular error; positive pulls against +err, negative flips direction
      q_omega: 0.5         # symmetric rate-tracking penalty; higher → keep velocities closer to target
      q_dtheta: 0.5         # symmetric penalty on change in error; higher → smooth oscillations/overshoot
      l_dtheta: 300.0         # signed bias on change in error; positive pushes toward decreasing error faster
      r: 2.0                # symmetric effort penalty on |u|; higher → smaller absolute commands
      s: 0.5              # symmetric smoothness penalty on Δu; higher → slower command changes
      l_du: 1.0             # signed bias on Δu; positive encourages positive slews, negative discourages them
      linear_scale_theta_weight: 50.0  # scales |theta_error| inside signed-term scale; higher suppresses bias when position error is large     
      terminal: 0.0         # optional terminal theta penalty multiplier applied at horizon end
      rho: 40000.0         # slack penalty for soft constraints
      theta_unit_scale_rad: 0.03   # normalization so a ~1.7° error is order-1 when weighted
      omega_unit_scale_rad_s: 1.0  # normalization for rad/s error magnitude
      effort_unit_scale: 8.0       # normalization for |u|; often set to the tighter of |u_min|/|u_max|
      slew_unit_scale: 50.0        # normalization for Δu per step; should align with constraints.du_max
    constraints:
      u_min: -6.0            # higher max magnitude (less negative) → allow more reverse drive; lower → tighten limit
      u_max: 6.0             # higher → allow stronger forward actuation; lower → cap absolute output earlier
      du_max: 50.0            # higher → permit faster command slews; lower → smooth transitions but slow response
      theta_min: -0.2        # higher (less negative) → shrink down-angle envelope; lower → allow more negative tilt/yaw
      theta_max: 0.2         # higher → allow larger up-angle; lower → constrain to smaller positive angles
      omega_min: -2.0        # higher (less negative) → limit negative rates more; lower → allow faster negative motion
      omega_max: 2.0         # higher → allow faster positive rates; lower → restrict positive motion speed

gimbal:
  auto_control_enabled: false    # set true on the Jetson when ControlCmd-driven auto control is desired
  backend: "mks_rs485"
  serial_port: "/dev/ttyTHS0"
  serial_port_jetson: "/dev/ttyTHS0"
  serial_port_rpi: "/dev/serial0"
  baudrate: 115200
  timeout: 0.1            # serial read/write timeout (seconds)
  retries: 1              # retry count for transient framing/CRC errors
  use_group_writes: true  # send writes to group addresses when available
  respond_on_writes: true  # motors configured with Respond=1 so write acks are returned
  yaw_addr: 1
  yaw_group_addr: null
  yaw_accel_byte: 10
  yaw_rate_limit_rad_s: 10.0
  pitch_group_addr: 80      # 0x50
  pitch_motor_a_addr: 2     # Dir set to CW in driver menu
  pitch_motor_b_addr: 3     # Dir set to CCW in driver menu
  pitch_encoder_authority: "a"
  pitch_accel_byte: 10
  pitch_rate_limit_rad_s: 10.0
  pitch_divergence_thresh_rad: 0.0873  # warn if secondary pitch encoder differs by >5 deg
  counts_per_rev: 16384
  yaw_gear_ratio: 1.0
  pitch_gear_ratio: 1.0
  parameter_file: "configs/mks_parameters.yaml"
  feedback_hz: 20.0

serial_io:
  startup:
    - name: "enable_yaw"
      target: "gimbal"
      func: "F3"
      addr: 1
      payload: [1]
      expect_reply: false
      priority: "critical"
    - name: "enable_pitch"
      target: "gimbal"
      func: "F3"
      addr: 80
      payload: [1]
      expect_reply: false
      priority: "critical"
    - name: "zero_yaw"
      target: "gimbal"
      func: "0x92"
      addr: 1
      payload: []
      expect_reply: false
      priority: "high"
    - name: "zero_pitch"
      target: "gimbal"
      func: "0x92"
      addr: 80
      payload: []
      expect_reply: false
      priority: "high"
    - name: "status_yaw"
      target: "gimbal"
      func: "F1"
      addr: 1
      payload: []
      expect_reply: true
      expected_len: 1
      priority: "high"
    - name: "status_pitch_a"
      target: "gimbal"
      func: "F1"
      addr: 2
      payload: []
      expect_reply: true
      expected_len: 1
      priority: "high"
    - name: "status_pitch_b"
      target: "gimbal"
      func: "F1"
      addr: 3
      payload: []
      expect_reply: true
      expected_len: 1
      priority: "high"
  schedule:
    - name: "status_yaw"
      target: "gimbal"
      func: "F1"
      addr: 1
      payload: []
      expect_reply: true
      expected_len: 1
      interval_ms: 1000
      priority: "normal"
    - name: "status_pitch"
      target: "gimbal"
      func: "F1"
      addr: 2
      payload: []
      expect_reply: true
      expected_len: 1
      interval_ms: 1000
      priority: "normal"
    - name: "encoder_yaw"
      target: "gimbal"
      func: "0x31"
      addr: 1
      payload: []
      expect_reply: true
      expected_len: 6
      interval_ms: 50
      priority: "high"
    - name: "encoder_pitch"
      target: "gimbal"
      func: "0x31"
      addr: 2
      payload: []
      expect_reply: true
      expected_len: 6
      interval_ms: 50
      priority: "high"

laser:
  # +X right, +Y up, +Z forward relative to the camera optical centre
  offset_m: { x: 0.0, y: -0.4, z: 0.0 }
  dir_cam: { x: 0.0, y: 0.0, z: 1.0 }
  render:
    beam_length_m: 5.0
    color_bgr: [0, 0, 255]
    thickness_px: 2
    hit_tolerance_px: 3.0
