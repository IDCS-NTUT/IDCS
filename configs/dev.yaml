video:
  active_profile: "720p"
  profiles:
    "720p":
      width: 1280
      height: 960
      fps: 30
      bitrate_kbps: 7000
    "1080p":
      width: 1920
      height: 1440
      fps: 20
      bitrate_kbps: 9000

camera:
  intrinsics:
    source: "fov"
    fov_deg: { h: 84.0, v: 53.0 }
  known_size_ranging:
    enabled: true
    dimension: "height"
    class_sizes_m:
      drone: 0.35
      person: 1.70
    class_aspect_ratio_limits:
      drone: { min: 0.6, max: 1.6 }
      person: { min: 1.2, max: 4.5 }
    min_pixels: 40.0
    ema_alpha: 0.9
net:
  jetson_ip: 192.168.0.2
  rtp_port: 5000
  zmq_results: "tcp://192.168.0.2:5556"
  header_push: "tcp://192.168.0.2:5555"    # PC PUSH → Jetson PULL
  zmq_control: "tcp://192.168.0.2:5557"    # Jetson PUB → PC SUB (control cmds)
  config_sync: "tcp://192.168.0.2:5560"    # Jetson binds REP; PC connects REQ for config handshake
  pc_ip: 192.168.0.1                       # PC’s IP for return video
  rtp_return_port: 5002                     # Jetson → PC video (RTP)

yolo:
  engine_size: "nano"  # Selects assets/nano_*.engine
  conf_thres: 0.25
  iou_thres: 0.45
  preprocess_mode: bilinear   # or "nearest"
  input_size: 1280
  class_labels:
    "0": drone
    "1": person

logging:
  cli_json: false            # pretty CLI logs by default; set true to emit JSON

perf:
  max_queue: 2
  drop_policy: oldest
source: "sim"
#source: "file:assets/one.mp4"

sim:
  renderer: cpu
  debug: false  # Enable orbiting camera + cube when true

control:
  mode: "rate"             # "rate" or "position"
  controller: "mpc"         # set "mpc" to enable predictive controller, "pid" for legacy loop
  aim_mode: "laser_point"   # "laser_point" (default) or "camera_center"
  loop_hz: 60              # control tick; if null, run at detection rate
  fov_deg: { h: 84.0, v: 53.0 }  # if intrinsics unknown
  fx_fy_from_fov: true     # compute fx,fy from FOV
  kp: { yaw: 5.0, pitch: 5.0 }    # rad/s per rad error
  kd: { yaw: 0.5, pitch: 0.5 }    # derivative gain
  ki: { yaw: 0.5, pitch: 0.5 }    # start at 0 to avoid windup
  rate_limits: { yaw: 10.0, pitch: 10.0 }  # rad/s caps
  accel_limits: { yaw: 40.0, pitch: 40.0 } # rad/s^2 slew
  deadband_px: 3            # ignore tiny errors
  smooth_px_alpha: 0.2      # EMA on centroid to reduce jitter
  lost_target_timeout_ms: 200
  reinit_on_lost: true
  target_selector: "max_conf"   # or "largest_area", "class:person"
  laser:
    tolerance_px: 4.0         # acceptable pixel delta between laser dot and target
    use_range: "known_size"   # known_size | ground_plane | auto | infinite
    default_distance_m: 25.0  # fallback distance when range unavailable
  sign_convention:
    yaw_positive: "right"    # "right"=u>cx is +yaw; flip if your axes differ
    pitch_positive: "up"     # v>cy decreases pitch; flip if needed
  mpc:
    # MPC settings are ignored unless controller == "mpc". Values below are
    # representative defaults and should be tuned per rig.
    horizons:
      prediction: 20         # higher → more foresight but heavier QP; lower → faster but shortsighted
      control: 5             # higher → more free moves; lower → forces earlier hold/blocked inputs
      sample_time_s: 0.02    # higher → slower loop, more lag; lower → faster updates, more noise sensitivity
      gamma: 0.98            # higher → value distant future errors more; lower → prioritize near-term tracking
      move_blocking: false   # true → reduces chatter by tying tail moves; false → allows independent steps
    plant:
      a_u: 15.0              # higher → assumes stronger actuation, leading to smaller commands; lower → opposite
      a_f: 4.0               # higher → models more damping so MPC pushes harder; lower → assumes freer motion
    estimator:
      q_theta: 1e-4          # higher → trust model less for angle, faster adaptation; lower → smoother but slower
      q_omega: 5e-3          # higher → allows quicker rate estimate changes; lower → steadier but laggier
      q_d: 1e-5              # higher → lets disturbance term wander; lower → keeps bias nearly constant
      r_theta: 2e-3          # higher → treat measurements as noisy (smoother estimates); lower → follow sensors tightly
    costs:
      q_theta_base: 8.0      # higher → prioritize angle accuracy; lower → allow more position error
      q_omega_base: 1.5      # higher → penalize rate mismatch/lead aggressively; lower → tolerate rate error
      r: 0.05                # higher → discourages large absolute commands; lower → allows stronger actuation
      s: 0.2                 # higher → smooths command changes; lower → permits rapid swings
      terminal: 2.0          # higher → force end-of-horizon alignment; lower/zero → rely on stage costs only
      rho: 1000.0            # higher → makes constraint violations very costly; lower → allows more slack usage
    adaptive_weights:
      alpha_d: 0.4           # higher → tighten tracking when target is close; lower → distance has less effect
      alpha_v: 0.2           # higher → react strongly to lateral motion; lower → less sensitivity to sideways speed
      alpha_tau: 0.4         # higher → boost weights when time-to-go shrinks; lower → softer response
      p: 1.2                 # higher → distance term grows faster as range closes; lower → gentler scaling
      eps: 1e-3              # higher → more floor/regularization, reducing extreme weights; lower → allows sharper spikes
      w_min: 0.2             # higher → raises minimum aggressiveness; lower → allows very gentle far-target tracking
      w_max: 5.0             # higher → permits very aggressive weighting; lower → caps aggressiveness sooner
    approach:
      k_approach: 0.05       # higher → demand faster error reversals vs. target motion; lower → milder biasing
      w_app_base: 0.15       # higher → strengthen approach preference; 0 disables the term entirely
      w_app_max: 1.0         # higher → allow strong approach weighting; lower → cap added curvature quickly
      e_gate_center: 0.2     # higher → bias engages even with larger errors; lower → only nudge when nearly aligned
      e_gate_width: 0.1      # higher → smoother/longer ramp around the center; lower → sharper on/off transition
      d_gate_near: 5.0       # higher → treat only very close targets as critical; lower → bias even when far
      d_gate_far: 20.0       # higher → extend biasing to more distant targets; lower → drop bias sooner with distance
    constraints:
      u_min: -8.0            # higher max magnitude (less negative) → allow more reverse drive; lower → tighten limit
      u_max: 8.0             # higher → allow stronger forward actuation; lower → cap absolute output earlier
      du_max: 2.0            # higher → permit faster command slews; lower → smooth transitions but slow response
      theta_min: -0.6        # higher (less negative) → shrink down-angle envelope; lower → allow more negative tilt/yaw
      theta_max: 0.6         # higher → allow larger up-angle; lower → constrain to smaller positive angles
      omega_min: -4.0        # higher (less negative) → limit negative rates more; lower → allow faster negative motion
      omega_max: 4.0         # higher → allow faster positive rates; lower → restrict positive motion speed

laser:
  # +X right, +Y up, +Z forward relative to the camera optical centre
  offset_m: { x: 0.0, y: -0.4, z: 0.0 }
  dir_cam: { x: 0.0, y: 0.0, z: 1.0 }
  render:
    beam_length_m: 5.0
    color_bgr: [0, 0, 255]
    thickness_px: 2
    hit_tolerance_px: 3.0





