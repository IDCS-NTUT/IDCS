video:
  width: 1280
  height: 720
  fps: 30
  bitrate_kbps: 4000
net:
  jetson_ip: 192.168.0.2
  rtp_port: 5000
  zmq_results: "tcp://192.168.0.2:5556"
  header_push: "tcp://192.168.0.2:5555"    # PC PUSH → Jetson PULL
  pc_ip: 192.168.0.1                       # PC’s IP for return video
  rtp_return_port: 5002                     # Jetson → PC video (RTP)

yolo:
  engine_path: "/home/idcs/Desktop/project/repo/IDCS/assets/best.engine"  # TensorRT engine (fixed 640x640)
  conf_thres: 0.25
  iou_thres: 0.45
  preprocess_mode: bilinear   # or "nearest"
  input_size: 1280

perf:
  max_queue: 2
  drop_policy: oldest
source: "sim"

sim:
  renderer: cpu
  debug: false  # Enable orbiting camera + cube when true
  targets:
    - cls: drone
      sprite: assets/drone.png
      size_m: 1.2
      position: [0.0, 2.5, -8.0]
      mode: circle
      path:
        radius: 4.5
        angular_speed_deg: 1.8
        bob_amplitude: 0.35
        bob_speed_deg: 6.0
        height_offset: 0.0
    - cls: person
      sprite: assets/person.png
      size_m: 1.7
      position: [-3.0, 1.0, -6.0]
      mode: figure8
      path:
        radius: 2.8
        angular_speed_deg: 1.4
        bob_amplitude: 0.15
        bob_speed_deg: 4.5
        height_offset: 0.0





