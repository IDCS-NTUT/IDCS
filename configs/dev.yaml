video:
  width: 1280
  height: 720
  fps: 30
  bitrate_kbps: 4000
net:
  jetson_ip: 192.168.0.2
  rtp_port: 5000
  zmq_results: "tcp://192.168.0.2:5556"
  header_push: "tcp://192.168.0.2:5555"    # PC PUSH → Jetson PULL
  pc_ip: 192.168.0.1                       # PC’s IP for return video
  rtp_return_port: 5002                     # Jetson → PC video (RTP)

yolo:
  engine_path: "/home/idcs/Desktop/project/repo/IDCS/assets/best.engine"  # TensorRT engine (fixed 640x640)
  conf_thres: 0.25
  iou_thres: 0.45
  preprocess_mode: bilinear   # or "nearest"
  input_size: 1280

perf:
  max_queue: 2
  drop_policy: oldest
source: "sim"

sim:
  renderer: gl
  renderer_opts:
    finish_before_read: true
  actors:
    - kind: person
      path: assets/person.obj
      scale: 0.01
      color: [0.2, 0.2, 0.8]
    - kind: drone
      path: assets/drone.obj
      scale: 0.02
      color: [0.8, 0.2, 0.2]


