video:
  active_profile: "1080p"
  profiles:
    "720p":
      width: 1280
      height: 960
      fps: 60
      bitrate_kbps: 7000
    "1080p":
      width: 1920
      height: 1440
      fps: 30
      bitrate_kbps: 9000

camera:
  libcamera:
    tuning_file: "/usr/share/libcamera/ipa/rpi/vc4/imx219_noir.json"
    shutter_us: null
    gain: null
  intrinsics:
    source: "fov"
    fov_deg: { h: 135.0, v: 73.0 }
  known_size_ranging:
    enabled: true
    dimension: "height"
    class_sizes_m:
      drone: 0.35
      person: 1.70
    class_aspect_ratio_limits:
      drone: { min: 0.6, max: 1.6 }
      person: { min: 1.2, max: 4.5 }
    min_pixels: 40.0
    ema_alpha: 0.9

net:
  jetson_ip: 192.168.0.5
  rtp_port: 5000
  zmq_results: "tcp://192.168.0.5:5556"
  header_push: "tcp://192.168.0.5:5555"    # PC PUSH → Jetson PULL
  zmq_control: "tcp://192.168.0.5:5557"    # Jetson PUB → PC SUB (control cmds)
  zmq_gimbal_state: "tcp://192.168.0.5:5558"  # Jetson PUB → SUB for physical CamState
  config_sync: "tcp://192.168.0.5:5560"    # Jetson binds REP; PC connects REQ for config handshake
  pc_ip: 192.168.0.1                       # PC’s IP for return video
  rtp_return_port: 5002                     # Jetson → PC video (RTP)

yolo:
  conf_thres: 0.25
  iou_thres: 0.45
  preprocess_mode: bilinear   # or "nearest"
  search_engine:
    size: "nano"
    input_size: 1920
  track_engine:
    size: "small"
    input_size: 1280
  dual_tracker:
    enabled: true
    enter_track_hits: 10
    exit_track_misses: 20
    recover_timeout_ms: 450
    heartbeat_interval_frames: 30
    transition_speed_rad_s: 1.0
    arrival_tolerance_px: 24.0
    transition_timeout_ms: 1200
  class_labels:
    "0": drone
    "1": person

logging:
  cli_json: false            # pretty CLI logs by default; set true to emit JSON

perf:
  max_queue: 2
  drop_policy: oldest

sim:
  renderer: opengl
  debug: false  # Enable orbiting camera + cube when true
  scene:
    buildings:
      - base_centre: [0.0, -100.0]
        footprint: [18.0, 14.0]
        height: 36.0
        color: [190, 190, 215]

    targets:
      - sprite: person
        ground: [0.5, -10.0]
        ground_y: 0.0
        height: 1.7
        color: [255, 128, 0]
      - sprite: drone
        ground: [0.0, -5.0]
        ground_y: 2.0
        width: 0.4
        color: [0, 255, 0]
        movement:
          type: circle
          radius: 4.0
          speed: 0.01
          phase: 0.0        
    cubes:
      - centre: [0.0, 0.75, 0.0]
        half_extents: [0.75, 0.75, 0.75]
        rotation: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        color: [64, 180, 250]

laser:
  # +X right, +Y up, +Z forward relative to the camera optical centre
  offset_m: { x: 0.0, y: -0.4, z: 0.0 }
  dir_cam: { x: 0.0, y: 0.0, z: 1.0 }
  render:
    beam_length_m: 5.0
    color_bgr: [0, 0, 255]
    thickness_px: 2
    hit_tolerance_px: 3.0
