source: "sim"
#source: "rpi"
#source: "file:assets/one.mp4"

control:
  mode: "rate"             # "rate" or "position"
  controller: "mpc"         # set "mpc" to enable predictive controller, "pid" for legacy loop
  aim_mode: "laser_point"   # "laser_point" (default) or "camera_center"
  loop_hz: 40              # control tick; if null, run at detection rate
  fov_deg: { h: 135.0, v: 73.0 }  # if intrinsics unknown
  fx_fy_from_fov: true     # compute fx,fy from FOV
  kp: { yaw: 1.0, pitch: 1.0 }    # rad/s per rad error
  kd: { yaw: 0.5, pitch: 0.5 }    # derivative gain
  ki: { yaw: 0.5, pitch: 0.5 }    # start at 0 to avoid windup
  rate_limits: { yaw: 0.5, pitch: 0.5 }  # rad/s caps
  accel_limits: { yaw: 2.0, pitch: 2.0 } # rad/s^2 slew
  deadband_px: 5           # ignore tiny errors
  smooth_px_alpha: 0.7      # EMA on centroid to reduce jitter
  motion_vel_alpha: 0.2     # EMA on angular velocity estimate (0=no update, 1=no smoothing)
  lost_target_timeout_ms: 500
  reinit_on_lost: true
  target_selector: "class:drone"   # or "largest_area", "class:person"
  laser:
    tolerance_px: 15.0         # acceptable pixel delta between laser dot and target
    use_range: "known_size"   # known_size | ground_plane | auto | infinite
    default_distance_m: 10.0  # fallback distance when range unavailable
  sign_convention:
    yaw_positive: "right"    # "right"=u>cx is +yaw; flip if your axes differ
    pitch_positive: "up"     # v>cy decreases pitch; flip if needed
  debug_overlay:
    enabled: true            # true → draw MPC term bars on return feed; false → hide overlay entirely
    history_window_s: 0.5     # higher → show longer history (more smoothing); lower → only recent frames
    opacity: 0.85             # higher → more opaque overlay; lower → less distracting translucent panel
    bar_height_px: 48         # higher → taller stacked bars; lower → conserve screen real-estate
    show_terms:               # order controls legend stacking; remove entries to hide those terms
      - theta                 # positional tracking penalty (higher weight → bigger bar when active)
      - omega                 # rate tracking penalty
      - dtheta                # error-change penalty capturing how error evolves over the horizon
      - effort                # absolute control effort term (R)
      - slew                  # input rate-change term (S)
      - slack                 # constraint slack penalty if soft bounds activate
  mpc:
    # MPC settings are ignored unless controller == "mpc". Values below are
    # representative defaults and should be tuned per rig.
    horizons:
      prediction: 20         # higher → more foresight but heavier QP; lower → faster but shortsighted
      control: 5             # higher → more free moves; lower → forces earlier hold/blocked inputs
      sample_time_s: 0.025    # higher → slower loop, more lag; lower → faster updates, more noise sensitivity
      effect_delay_mode: "fixed"  # "fixed" uses effect_delay_s, "time_to_impact" uses distance/projectile speed
      effect_delay_s: 0.05    # fixed-mode fallback delay (seconds)
      projectile_speed_m_s: 110.0  # projectile speed used by time_to_impact mode
      impact_delay_bias_s: 0.0  # additive bias on computed time-to-impact delay
      predictor_enabled: true  # alpha-beta predictor over target angle/rate for cleaner lookahead references
      predictor_alpha: 0.02    # position correction gain (higher tracks measurements more tightly)
      predictor_beta: 0.02     # rate correction gain (higher adapts velocity estimate faster)
      adaptive_effect_delay_enabled: true  # adapt time-of-effect delay online using residual motion error
      adaptive_effect_delay_min_s: 0.0     # lower bound for adaptive delay estimate
      adaptive_effect_delay_max_s: 0.2     # upper bound for adaptive delay estimate
      adaptive_effect_delay_alpha: 0.04     # low-pass blend factor for delay updates
      adaptive_effect_delay_gain: 0.04      # correction gain from residual-derived delay error
      adaptive_effect_delay_rate_eps: 0.001  # minimum |omega| before adaptive updates are allowed
      gamma: 0.85            # higher → value distant future errors more; lower → prioritize near-term tracking
      move_blocking: false   # true → reduces chatter by tying tail moves; false → allows independent steps
    plant:
      a_u: 15.0              # higher → assumes stronger actuation, leading to smaller commands; lower → opposite
      a_f: 1.0               # higher → models more damping so MPC pushes harder; lower → assumes freer motion
    estimator:
      q_theta: 0.02           # higher → trust model less for angle, faster adaptation; lower → smoother but slower
      q_omega: 0.02          # higher → allows quicker rate estimate changes; lower → steadier but laggier
      q_d: 0.01              # higher → lets disturbance term wander; lower → keeps bias nearly constant
      r_theta: 2.0          # higher → treat measurements as noisy (smoother estimates); lower → follow sensors tightly
      use_rate_measurement: false  # set false to ignore pan_rate/tilt_rate in KF update (theta-only update)
    costs:
      # Quadratic and linear tracking weights (shared across yaw/pitch)
      q_theta: 2.5         # symmetric angular tracking penalty; higher → punish large angle error more
      q_omega: 0.3         # symmetric rate-tracking penalty; higher → keep velocities closer to target
      q_dtheta: 2.5         # symmetric penalty on change in error; higher → smooth oscillations/overshoot
      r: 0.9              # symmetric effort penalty on |u|; higher → smaller absolute commands
      s: 2.5              # symmetric smoothness penalty on Δu; higher → slower command changes
      linear_scale_theta_weight: 1.0  # scales |theta_error| inside signed-term scale; higher suppresses bias when position error is large
      terminal: 4.0         # optional terminal theta penalty multiplier applied at horizon end
      rho: 5.0         # slack penalty for soft constraints
    outer_tuner:
      enabled: true               # true -> periodically retune selected MPC weights from recent tracking metrics
      update_interval_s: 3.0       # how often to apply a new tuning update
      history_window_s: 8.0        # rolling window used to summarize recent error/command behaviour
      min_samples: 40              # minimum samples required before each retune step
      target_abs_err_rad: 0.02     # target mean absolute angular error (rad)
      target_abs_cmd_rad_s: 0.05   # target mean absolute command magnitude (rad/s)
      step_up: 0.10                # multiplicative growth step when a weight needs to increase
      step_down: 0.05              # multiplicative decay step when a weight needs to decrease
      min_scale: 0.4               # lower bound for per-weight scale relative to configured base weight
      max_scale: 2.5               # upper bound for per-weight scale relative to configured base weight
      state_path: "logs/mpc_outer_tuner_state.json"  # optional JSON snapshot path for persisted tuner scales
      load_on_start: false         # keep false while debugging instability; avoids restoring stale tuner scales
      save_on_update: true         # write scales to state_path after each tuner update
      # Grouped tuning mode (recommended):
      # Select exactly one group below; tuner adjusts individual parameters inside that group.
      parameter_group: "costs_tracking"  # q_theta, q_omega, q_dtheta, terminal
      # parameter_group: "costs_effort"    # r, s, rho
      # parameter_group: "estimator"       # q_theta, q_omega, q_d, r_theta
      # parameter_group: "predictor"       # predictor_alpha, predictor_beta
      # parameter_group: "adaptive_delay"  # adaptive_effect_delay_gain/alpha/rate_eps

      # Legacy direct-weights mode (used only when parameter_group is omitted):
      weights:                     # subset of [q_theta, q_omega, q_dtheta, r, s, terminal, rho]
        - q_theta
        - q_dtheta
        - r
        - s
    constraints:
      u_min: -1.0            # higher max magnitude (less negative) → allow more reverse drive; lower → tighten limit
      u_max: 1.0             # higher → allow stronger forward actuation; lower → cap absolute output earlier
      du_max: 0.5            # higher → permit faster command slews; lower → smooth transitions but slow response
      theta_min: -0.2        # higher (less negative) → shrink down-angle envelope; lower → allow more negative tilt/yaw
      theta_max: 0.2         # higher → allow larger up-angle; lower → constrain to smaller positive angles
      omega_min: -0.5        # higher (less negative) → limit negative rates more; lower → allow faster negative motion
      omega_max: 0.5         # higher → allow faster positive rates; lower → restrict positive motion speed

gimbal:
  auto_control_enabled: false    # set true on the Jetson when ControlCmd-driven auto control is desired
  backend: "mks_rs485"
  serial_port: "/dev/ttyUSB0"
  baudrate: 115200
  timeout: 0.02           # serial read/write timeout (seconds)
  retries: 1              # retry count for transient framing/CRC errors
  use_group_writes: true  # send writes to group addresses when available
  respond_on_writes: true  # motors configured with Respond=1 so write acks are returned
  yaw_addr: 1
  yaw_group_addr: null
  yaw_accel_byte: 10
  yaw_rate_limit_rad_s: 10.0
  pitch_motor_a_addr: 2
  pitch_motor_b_addr: 3
  pitch_motor_a_sign: 1.0   # software direction sign applied to pitch motor A commands
  pitch_motor_b_sign: -1.0  # software direction sign applied to pitch motor B commands
  pitch_encoder_authority: "a"
  pitch_accel_byte: 10
  pitch_rate_limit_rad_s: 10.0
  pitch_divergence_thresh_rad: 0.0873  # warn if secondary pitch encoder differs by >5 deg
  counts_per_rev: 16384
  yaw_gear_ratio: 1.0
  pitch_gear_ratio: 1.0
  parameter_file: "configs/mks_parameters.yaml"
  feedback_hz: 20.0

serial_io:
  startup:
    - name: "enable_yaw"
      target: "gimbal"
      func: "F3"
      addr: 1
      payload: [1]
      expect_reply: true
      priority: "critical"
    - name: "enable_pitch_a"
      target: "gimbal"
      func: "F3"
      addr: 2
      payload: [1]
      expect_reply: true
      priority: "critical"
    - name: "enable_pitch_b"
      target: "gimbal"
      func: "F3"
      addr: 3
      payload: [1]
      expect_reply: true
      priority: "critical"
    - name: "zero_yaw"
      target: "gimbal"
      func: "0x92"
      addr: 1
      payload: []
      expect_reply: true
      priority: "high"
    - name: "zero_pitch_a"
      target: "gimbal"
      func: "0x92"
      addr: 2
      payload: []
      expect_reply: true
      priority: "high"
    - name: "zero_pitch_b"
      target: "gimbal"
      func: "0x92"
      addr: 3
      payload: []
      expect_reply: true
      priority: "high"
    - name: "status_yaw"
      target: "gimbal"
      func: "F1"
      addr: 1
      payload: []
      expect_reply: true
      expected_len: 1
      priority: "high"
    - name: "status_pitch_a"
      target: "gimbal"
      func: "F1"
      addr: 2
      payload: []
      expect_reply: true
      expected_len: 1
      priority: "high"
    - name: "status_pitch_b"
      target: "gimbal"
      func: "F1"
      addr: 3
      payload: []
      expect_reply: true
      expected_len: 1
      priority: "high"
  schedule:
    - name: "status_yaw"
      target: "gimbal"
      func: "F1"
      addr: 1
      payload: []
      expect_reply: true
      expected_len: 1
      interval_ms: 1000
      priority: "normal"
    - name: "status_pitch"
      target: "gimbal"
      func: "F1"
      addr: 2
      payload: []
      expect_reply: true
      expected_len: 1
      interval_ms: 1000
      priority: "normal"
    - name: "encoder_yaw"
      target: "gimbal"
      func: "0x31"
      addr: 1
      payload: []
      expect_reply: true
      expected_len: 6
      interval_ms: 50
      priority: "high"
    - name: "encoder_pitch"
      target: "gimbal"
      func: "0x31"
      addr: 2
      payload: []
      expect_reply: true
      expected_len: 6
      interval_ms: 50
      priority: "high"
    - name: "encoder_pitch_b"
      target: "gimbal"
      func: "0x31"
      addr: 3
      payload: []
      expect_reply: true
      expected_len: 6
      interval_ms: 50
      priority: "high"
