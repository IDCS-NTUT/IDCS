# Byte4-Byte37 defaults from MKS SERVO42/57D_RS485 manual §5.9/§8.3.
# Values are sent with the 0x46 "Write all configuration parameters" command.
# Update per-motor lists as needed for your setup before starting the gimbal bridge.
#
# Parameter byte meanings (single unsigned bytes unless noted; defaults shown in HEX):
# Byte4: Mode (single command 0x82; default 02).
# Byte5: Work current MSB (single command 0x83; defaults 0C/06/03/02 paired with Byte6).
# Byte6: Work current LSB (single command 0x83; defaults 80/40/20/58 paired with Byte5).
# Byte7: Hold current percentage (single command 0x9B; default 04).
# Byte8: Subdivision / microstep setting (single command 0x84; default 10).
# Byte9: En (single command 0x85; default 00).
# Byte10: Dir (single command 0x86; default 00).
# Byte11: AutoSDD (single command 0x87; default 00).
# Byte12: Protect (single command 0x88; default 00).
# Byte13: MpIyer (single command 0x89; default 01).
# Byte14: Baud rate selector (single command 0x8A; default 04).
# Byte15: Slave address (single command 0x8B; default 01).
# Byte16: Group address (single command 0x8D; default 00).
# Byte17: Respond (single command 0x8C; default 01).
# Byte18: Active (single command 0x8C; default 01).
# Byte19: MODBUS enable (single command 0x8E; default 00).
# Byte20: Key lock (single command 0x8F; default 00).
# Byte21: HmTrig (single command 0x90; default 00).
# Byte22: HmDir (single command 0x90; default 00).
# Byte23: HmSpeed MSB (single command 0x90; default 00).
# Byte24: HmSpeed LSB (single command 0x90; default 3C).
# Byte25: EndLimit (no single-command code; default 00).
# Byte26: retValue byte0 (single command 0x94; default 00).
# Byte27: retValue byte1 (single command 0x94; default 00).
# Byte28: retValue byte2 (single command 0x94; default 20).
# Byte29: retValue byte3 (single command 0x94; default 00).
# Byte30: Hm-mode (no single-command code; default 00).
# Byte31: Hm_ma byte0 (no single-command code; defaults 03/01/00/00).
# Byte32: Hm_ma byte1 (no single-command code; defaults 20/90/C8/C8).
# Byte33: remap (single command 0x9E; default 00).
# Byte34: 0_Mode (single command 0x9A; default 00).
# Byte35: Set 0 (no single-command code; default 00).
# Byte36: 0_Speed (no single-command code; default 02).
# Byte37: 0_Dir (no single-command code; default 01).
