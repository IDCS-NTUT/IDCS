camera:
  libcamera:
    sensor_id: 0
    sensor_mode: 4
    tuning_file: "/usr/share/libcamera/ipa/rpi/vc4/imx219_noir.json"
  intrinsics:
    source: "fov"
    fov_deg: { h: 135.0, v: 73.0 }
  known_size_ranging:
    enabled: true
    dimension: "width"
    class_sizes_m:
      drone: 0.35
      person: 0.45
    class_aspect_ratio_limits:
      drone: { min: 0.4, max: 2.0 }
      person: { min: 1.2, max: 4.5 }
    min_pixels: 10.0
    ema_alpha: 0.9

camstate_devices:
  mpu_bus: 7
  mpu_addr: 104                        # 0x68
  mag_addr: 12                         # 0x0C (AK8963 via MPU9255 bypass)
  publish_hz: 50.0

perception:
  class_labels:
    "0": drone
    "1": person

laser:
  # +X right, +Y up, +Z forward relative to the camera optical centre
  offset_m: { x: 0.0, y: -0.4, z: 0.0 }
  dir_cam: { x: 0.0, y: 0.0, z: 1.0 }
  render:
    beam_length_m: 5.0
    color_bgr: [0, 0, 255]
    thickness_px: 2
    hit_tolerance_px: 30.0
