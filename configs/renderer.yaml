# Renderer configuration for OpenGL renderer and preview tools
# Paths are relative to the repository root; asset paths relative to 'assets/'.
renderer:
  backend: opengl
  debug: 0            # 0=shaded, 1=normal, 2=albedo, 3=depth
  width: 1280
  height: 720
  near: 0.1
  far: 100.0

pbr:
  default_albedo: [180, 180, 210]    # RGB 0-255 used when no albedo map
  default_metallic: 0.4
  default_roughness: 0.8
  use_normal_maps: true
  texture_search_paths:
    - assets/textures
    - assets/materials

ground:
  color: [128, 128, 128]   # RGB 0-255 ground plane tint
  metallic: 0.5            # PBR metallic factor for ground
  roughness: 0.1          # PBR roughness factor for ground

ibl:
  enabled: true
  intensity: 2.0            # scales ambient/specular image-based lighting
  hdr_env_map: assets/env/industrial.hdr   # optional HDR equirectangular
  irradiance_cubemap_resolution: 32
  prefilter_cubemap_resolution: 128
  max_prefilter_mip: 5

sky:
  type: hdr      # choices: hdr | procedural
  intensity: 2.0
  procedural:
    model: hosek_wilkie
    sun_elevation: 60.0   # degrees, 0=horizon 90=zenith
    sun_azimuth: 180.0      # degrees, 0=forward 90=right 180=back 270=left
    turbidity: 2.0
    horizon_color: [0.5, 0.5, 0.7]      # RGB 0-1, horizon glow color
    zenith_color: [0.7, 0.8, 1.0]       # RGB 0-1, sky zenith color
    sun_color: [1.0, 1.0, 0.9]          # RGB 0-1, sun disk color
  hdr: assets/sky/skybox.hdr

shadows:
  enabled: true
  method: vsm            # pcf | vsm | esmp
  softness: 0.6
  bias: 0.0
  strength: 0.0
  cascade_count: 3       # for CSM (0 = no cascades)
  resolution: 2048
  debug_stats: false

post_processing:
  tone_mapping: aces     # none | reinhard | aces
  bloom:
    enabled: true
    threshold: 1.0
    intensity: 0.6
    blur_radius: 8
  ssao:
    enabled: true
    radius: 0.5
    intensity: 1.0
  fxaa: true
  taa:
    enabled: false
    feedback: 0.85
  dof:
    enabled: false
    focus_distance: 10.0
    aperture: 2.8
  motion_blur:
    enabled: false
    sample_count: 8

camera_sensor:
  exposure:
    mode: auto    # auto | manual
    value: 0.0
    min_ev: -6.0
    max_ev: 6.0
  white_balance: 6500
  lens:
    distortion_coeffs: [0.0, 0.0, 0.0]  # k1, k2, k3 radial
    vignette: 0.05
  noise:
    shot_noise_scale: 1.0
    read_noise_sigma: 0.5
  rolling_shutter:
    enabled: false
    readout_time_ms: 20.0

performance:
  quality: high   # low | medium | high
  msaa_samples: 4
  anisotropic_filter: 8
  reduce_post_resolution: 1.0  # 0.5 -> half-res post effects

presets:
  low:
    pbr: { default_roughness: 1.0 }
    shadows: { enabled: false }
    post_processing: { ssao: { enabled: false }, bloom: { enabled: false }, taa: { enabled: false } }
    performance: { quality: low, msaa_samples: 0 }
  medium:
    pbr: { default_roughness: 0.8 }
    shadows: { enabled: true, resolution: 1024 }
    post_processing: { ssao: { enabled: true }, bloom: { enabled: true } }
    performance: { quality: medium, msaa_samples: 2 }
  high:
    pbr: { default_roughness: 0.6 }
    shadows: { enabled: true, resolution: 2048 }
    post_processing: { ssao: { enabled: true }, bloom: { enabled: true }, taa: { enabled: true } }
    performance: { quality: high, msaa_samples: 4 }

