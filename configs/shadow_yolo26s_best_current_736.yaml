# Shadow inference candidate only.  This leaves the normal perception config
# and any production engine selection unchanged.
source: "sim"
yolo:
  conf_thres: 0.30
  iou_thres: 0.50
  preprocess_mode: "bilinear"
  search_engine:
    size: "small"
    input_size: 736
  dual_tracker:
    enabled: false
