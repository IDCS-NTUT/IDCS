# Control-free live visual-lock canary. Load AFTER v2_scene.yaml.
# Same physical mesh size/camera; closer range and slower motion isolate transport
# from the not-yet-integrated displayed-frame ROI editor/cache. No truth input.
sim:
  scene:
    targets:
      - sprite: "drone"
        width: 0.35
        height: 0.4
        color: [55, 65, 75]
        orientation: [90.0, 0.0, 0.0]
        movement:
          type: "path"
          speed_m_s: 0.05
          points:
            - [0.3, 1.24, -1.5]
            - [0.6, 1.24, -1.5]
            - [0.6, 1.24, -1.9]
            - [0.3, 1.24, -1.9]
          dynamics:
            enabled: true
            max_accel_m_s2: 0.1
            max_decel_m_s2: 0.14
            arrival_radius_m: 0.05
