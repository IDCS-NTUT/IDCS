# GPU-rendered scene for closed-loop tracking: a native-mesh drone flying a
# fast smooth ellipse (~+/-0.12 rad yaw, +/-0.06 rad pitch, ~0.3 rad/s peak)
# in front of the camera, which is fast enough for target-rate feedforward to
# matter. Combine with exactly one mode overlay: sim_mode_hil.yaml (camera
# follows the measured gimbal) or sim_mode_simulated_mount.yaml.
source: "sim"

sim:
  renderer: "opengl"
  freeze_frame: false
  camera:
    fov_y_deg: 60.0
  renderer_opts:
    target_render_mode: "mesh"
    draw_ground_grid: false
    sky:
      type: "procedural"
      intensity: 1.0
      procedural:
        horizon_color: [0.75, 0.80, 0.85]
        zenith_color: [0.45, 0.65, 0.90]
        sun_color: [1.0, 0.98, 0.90]
        sun_elevation: 60.0
        sun_azimuth: 180.0
        turbidity: 2.0
    ibl:
      enabled: false
      intensity: 0.25
    ground:
      color: [155, 175, 160]
      albedo_map: ""
      normal_map: ""
    building:
      albedo_map: ""
      normal_map: ""
  scene:
    mode: "static_targets"
    buildings: []
    cubes: []
    targets:
      - sprite: "drone"
        width: 0.35
        height: 0.4
        color: [55, 65, 75]
        orientation: [90.0, 0.0, 0.0]
        movement:
          type: "path"
          speed_m_s: 0.30
          points:
            - [0.0000, 1.0600, -0.90]
            - [0.0459, 1.0554, -0.90]
            - [0.0849, 1.0424, -0.90]
            - [0.1109, 1.0230, -0.90]
            - [0.1200, 1.0000, -0.90]
            - [0.1109, 0.9770, -0.90]
            - [0.0849, 0.9576, -0.90]
            - [0.0459, 0.9446, -0.90]
            - [0.0000, 0.9400, -0.90]
            - [-0.0459, 0.9446, -0.90]
            - [-0.0849, 0.9576, -0.90]
            - [-0.1109, 0.9770, -0.90]
            - [-0.1200, 1.0000, -0.90]
            - [-0.1109, 1.0230, -0.90]
            - [-0.0849, 1.0424, -0.90]
            - [-0.0459, 1.0554, -0.90]
          dynamics:
            enabled: true
            max_accel_m_s2: 1.5
            max_decel_m_s2: 1.5
            arrival_radius_m: 0.01
