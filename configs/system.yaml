rpi:
  return_video:
    sink: "waylandsink"                         # Wayland desktop window output on Pi
    session_env:                                # applied by rpi.return_video before creating sink
      WAYLAND_DISPLAY: "wayland-1"
      XDG_RUNTIME_DIR: "/run/user/1000"
      DISPLAY: ":0"                            # optional; used by ximagesink/xvimagesink
    hdmi_port: null                        # set once kmssink_connector_map contains real DRM connector IDs
    kmssink_connector_id: 42
    kmssink_connector_map: {}             # placeholder; DRM connector IDs are not usually 0/1
  runtime_control:
    invert_yaw: true
    invert_pitch: false
  gpio:
    input_pull: up
    input_modes:
      control_switch: latch
    # Optional per-input overrides; unspecified inputs keep input_pull above.
    input_pulls:
      control_switch: down
      fire_control: down
      safety: down
    inputs:
      fire: 13
      fire_control: 12
      safety: 16	
      emergency: 6
      control_switch: 5
    output_active_level: high
    outputs:
      fire_control_light: 22
      safety_light: 25
      green_light: 18
      yellow_light: 23
      red_light: 24

logging:
  cli_json: false            # pretty CLI logs by default; set true to emit JSON

perf:
  max_queue: 2
  drop_policy: oldest

sim:
  renderer: opengl
  debug: false  # Enable orbiting camera + cube when true
  use_jetson_cam_state: true  # true -> drive sim camera pose from net.zmq_gimbal_state
  jetson_cam_state_stale_timeout_s: 0.5  # fallback to ControlCmd integration when stale
  scene:
    # Live planner-evaluation scenario. Target spawn placement is automatic
    # inside the current camera view; targets then fly toward the defended asset.
    # Set mode: static_targets to render the fixed targets below instead.
    mode: planner_eval
    planner_eval:
      seed: 7
      max_active_targets: 3
      speed_m_s: [1.0, 2.0]
      engage_dwell_s: 0.35
      match_radius_px: 40.0
      breach_zone: critical

    buildings:
      - base_centre: [10.0, -100.0]
        footprint: [18.0, 14.0]
        height: 36.0
        color: [190, 190, 215]
        # optional building textures


    targets:
      - sprite: person
        ground: [0.0, -10.0]
        ground_y: 0.0
        height: 1.7
        color: [72, 64, 64]
        orientation: [-90.0, 0.0, 0.0] 

      - sprite: drone
        ground: [0.5, -2.5]
        ground_y: 2.0
        width: 0.4
        color: [32, 32, 32]
        orientation: [90.0, 0.0, 00.0]
        movement:
         type: path
         speed_m_s: 0.5
         points:
          - [0.5, 2.5, -2.5]
          - [1.0, 2.5, -2.5]
          - [1.0, 2.0, -2.5]
        dynamics:
          enabled: true
          max_accel_m_s2: 3.0
          max_decel_m_s2: 5.0
          arrival_radius_m: 0.2
      - sprite: drone
        ground: [-3.0, -0.5]
        ground_y: 1.5
        width: 0.4
        color: [32, 32, 32]
        orientation: [180.0, 0.0, -15.0]
      - sprite: drone
        ground: [-3.5, 0.5]
        ground_y: 1.5
        width: 0.4
        color: [32, 32, 32]
        orientation: [0.0, 0.0, 0.0]      
        # movement:
        #   type: circle
        #   radius: 6.0
        #   speed: 0.01308996938995747  # rad/frame (~0.75 deg/frame)
        # movement:
        #   type: path
        #   speed_m_s: 1.2
        #   points:
        #     - [0.5, 2.0, -2.5]
        #     - [2.0, 2.5, -5.0]
        #     - [-1.0, 1.8, -7.0]
        #   dynamics:
        #     enabled: true
        #     max_accel_m_s2: 0.8
        #     max_decel_m_s2: 1.0
        #     arrival_radius_m: 0.15
        # orientation: [yaw, pitch, roll] in degrees (applies to 3D mesh target)
 
    cubes:
      - centre: [0.0, 0.75, 0.0]
        half_extents: [0.75, 0.75, 0.75]
        rotation: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        color: [64, 180, 250]

threat_eval:
  enabled: true
  defended_asset:
    id: asset_0
    position_world: [0.0, 1.0, 0.0]
  zones:
    warning:
      type: circle
      radius_m: 10.0
    restricted:
      type: circle
      radius_m: 5.0
    critical:
      type: circle
      radius_m: 0.5

swarm_eval:
  enabled: true
  hostile_levels: ["suspicious", "threatening"]
  max_engage_distance_m: 25.0
  exact_search_limit: 6
  beam_width: 8
  switch_absolute_damage_gain: 0.25
  switch_relative_improvement: 0.10
  default_damage_weight: 1.0
  excluded_target_classes: ["person"]
  damage_by_class:
    drone: 2.0
    person: 0.0
  learned_model:
    enabled: true
    backend: auto
    model_path: assets/models/swarm/swarm_policy.engine
    fallback_to_planner: true
    async_worker: true
    max_update_rate_hz: null
    max_result_age_ms: 150.0
    max_targets_tensor: 8
    normalization:
      max_distance_m: 80.0
      max_closing_speed_m_s: 12.0
      max_breakthrough_time_s: 40.0
      max_time_to_engage_s: 8.0
      max_damage_weight: 10.0
      max_angle_rad: 0.8
      max_track_observations: 10
      max_track_age_s: 5.0
  timing:
    base_track_lock_s: 0.15
    search_track_lock_s: 0.25
    recover_track_lock_s: 0.40
    low_conf_threshold: 0.60
    low_conf_penalty_s: 0.20
    min_track_observations: 3
    low_continuity_penalty_s: 0.08
    missing_range_penalty_s: 0.10
    predictive_penalty_s: 0.20
    effect_time_s: 0.25
    effect_distance_scale_s_per_m: 0.01
    confirm_time_s: 0.10
    confirm_distance_scale_s_per_m: 0.004
    settle_margin_s: 0.05
