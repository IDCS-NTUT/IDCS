# Threat evaluation neural network model training configuration

model:
  architecture: mlp  # simple feedforward network
  input_size: 176    # 16 frames × 11 features
  hidden_sizes: [64, 32]
  output_size: 3  # classes: benign, suspicious, threatening
  activation: relu
  use_batch_norm: false

training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adam
  loss_function: cross_entropy
  early_stopping_patience: 10
  early_stopping_metric: val_loss  # or 'val_accuracy'
  
# Data and paths
paths:
  dataset_dir: dataset/
  model_output_dir: models/
  logs_dir: training_logs/
  
# Logging and checkpointing
logging:
  log_interval: 10  # log every N batches
  save_best_model: true
  checkpoint_interval: 5  # save checkpoint every N epochs
  
# Evaluation metrics to report
evaluation:
  report_per_class_metrics: true
  report_confusion_matrix: true
  report_safety_metrics: true  # false threat rate, missed threat rate
  save_predictions: true  # save all predictions for analysis
