[project]
name = "IDCS"
version = "0.1.0"
description = "PC↔Jetson GStreamer video, YOLO inference on Jetson, ZMQ results back"
authors = [{name="Your Name", email="you@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "pyzmq>=26.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
pc = [
  "opencv-python>=4.8",
  "moderngl>=5.12.0",
  "glfw>=2.5.0",
  "trimesh>=3.9.0",
  # Textures, HDR sky and IBL environment maps; without it the OpenGL
  # renderer silently falls back to flat colours.
  "imageio>=2.30",
]
train = [
  "ultralytics>=8.3",
]
jetson = [
  "opencv-python>=4.8",
  "osqp>=0.6",
  "pyserial>=3.5,<4.0",
  "ultralytics>=8.3",
  # TensorRT / PyCUDA are provided by JetPack; you can add wheels if needed
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "jetson*", "pc*"]
